name: Build iXpand Drive

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Inspect repository
        run: |
          echo "=== Important files ==="
          find . -maxdepth 3 -type f | sort

          echo "=== Main library ==="
          ls -lh "iXpand Drive.a" || true

          echo "=== App directory ==="
          ls -lah "app/iXpand Drive.app" || true

      - name: Make build script executable
        run: chmod +x experimental-build.sh

      - name: Build
        run: ./experimental-build.sh

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iXpand-unsigned
          path: iXpand-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
